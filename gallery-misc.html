<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery ✧ — Robert Phipps</title>
<link rel="icon" type="image/jpg" href="/images/favicon.jpg">
<link rel="preload" href="fonts/texgyreheros-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body class="center-page gallery-page">

<header class="site-logo has-mark">
  <a class="logo" href="index.html" aria-label="Robert Phipps, home"><img class="logo-anim" src="images/favicon.gif" alt="" width="48" height="48"><img class="logo-static" src="images/favicon.jpg" alt="" width="48" height="48"></a>
  <button type="button" class="page-mark-btn" data-sound="audio/gallerymisc.wav" aria-label="Images I have collected (play sound)"><span class="page-glyph" aria-hidden="true">&#10023;</span></button>
  <div class="gallery-help">
    <div class="help-clip"><button type="button" class="help-bubble" id="help-bubble">what is this?</button></div>
    <button type="button" class="help-mark" id="help-mark" aria-label="About this gallery" aria-expanded="false" aria-controls="help-bubble"><span class="help-glyph" aria-hidden="true"></span><span class="help-q" aria-hidden="true"><span class="help-q-glyph">?</span></span></button>
  </div>
</header>

<div class="wrap crumb-row">
  <a class="breadcrumb" href="gallery.html" aria-label="Back to gallery">←<span class="crumb-moon"> ࣪ ִֶָ☾</span>.</a>
</div>

<main>
  <div class="wrap"><div class="gallery-intro" id="gallery-intro" aria-live="off"></div></div>
  <div class="gallery-stage">
    <div class="frontispiece-slot">
      <button type="button" class="frontispiece-wrap" id="frontispiece-wrap" aria-label="Enlarge image">
        <img class="frontispiece" id="frontispiece-img" alt="">
        <span class="frontispiece-caption" id="frontispiece-caption"></span>
      </button>
    </div>
    <button type="button" class="gallery-refresh" id="gallery-refresh" aria-label="Show another image">&#8634;</button>
  </div>
</main>


<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image" aria-hidden="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <p class="lightbox-caption" id="lightbox-caption"></p>
</div>

<!-- The text typed out when "what is this?" is clicked. Edit or add <p> paragraphs here. -->
<template id="gallery-intro-text">
  <p>This page is a digital gallery of images made by other people that have affected me in some way. Think of its purpose as a sort of blog, maybe. Whenever possible, captions are provided to give context and credit.</p>
  <p>Images are shown at random. Click the cycle button below or reload the page to see something different.</p>
</template>

<script src="gallery-help.js"></script>
<script>
(function(){
  var images = [
    //{ src: "images/brand-mark.jpg", artist: "Renato Mambor", title: "Capovolto", year: "1963" },
    { src: "images/gallery/theirs/1.jpg", artist: "Carl Strathmann", title: "Lunar Landscape with Owls", year: "1900" },
    { src: "images/gallery/theirs/2.jpg", artist: "J. M. W. Turner", title: "A Paddle-steamer in a Storm", year: "1841" },
    { src: "images/gallery/theirs/3.jpg", artist: "Jimmy Mitchell", title: "Paul Newman on the set of \"Butch Cassidy and the Sundance Kid\" Dir. George Roy Hill", year: "1969" },
    { src: "images/gallery/theirs/4.jpg", artist: "Paul Gervais", title: "Histoire naturelle des mammifères", year: "c.1854–1855" },
    { src: "images/gallery/theirs/5.jpg", artist: "Mark Rothko", title: "Untitled", year: "1961, Pen and ink and wash on woven paper" },
    { src: "images/gallery/theirs/6.jpg", artist: "Jean-Michel Basquiat", title: "Untitled (Peso Neto)", year: "1981, Crayon on notebook paper" },
    { src: "images/gallery/theirs/7.jpg", artist: "Francis Bacon", title: "Figure in a framework", year: "c.1957-61, Graphite and oil paint on paper" },
    { src: "images/gallery/theirs/8.jpg", artist: "Fernand Nadal", title: "Untitled (Through the Porthole, Ocean and Sky)", year: "Late 19th Century" },
    { src: "images/gallery/theirs/9.jpg", artist: "Shiko Munakata", title: "Bush Warbler", year: "1959, Woodcut" },
    { src: "images/gallery/theirs/10.jpg", artist: "Robert Rauschenberg", title: "Untitled (Pegasus)", year: "1991, Woodcut" },
    { src: "images/gallery/theirs/11.jpg", artist: "George Ault", title: "Moon and Clouds", year: "1945" },
    { src: "images/gallery/theirs/12.jpg", artist: "June Wayne", title: "Tenth Memory", year: "1961" },
    { src: "images/gallery/theirs/13.jpg", artist: "Jiri Jenicek", title: "Stairs", year: "1931" },
    { src: "images/gallery/theirs/14.jpg", artist: "Elliott Erwitt", title: "From \"New York City\"", year: "1949" },
    { src: "images/gallery/theirs/15.jpg", artist: "Marc Riboud", title: "Elephants bathing in the Gange", year: "1956" },
    { src: "images/gallery/theirs/16.jpg", artist: "Roy DeCarava", title: "Dancers", year: "1956" },
    { src: "images/gallery/theirs/17.jpg", artist: "Ernst Haas", title: "On the Set of \"Love and Death\" Dir. Woody Allen", year: "1975" },
    { src: "images/gallery/theirs/18.jpg", artist: "Anton Pieck", title: "Moonlight Night", year: "1941" },
    { src: "images/gallery/theirs/19.jpg", artist: "Henri Cartier-Bresson", title: "Italy, Sicily, Palermo, Town Hall", year: "1971" },
    { src: "images/gallery/theirs/20.jpg", artist: "Fan Ho", title: "Trio 三重奏", year: "1956" },
    { src: "images/gallery/theirs/21.jpg", artist: "Follower of Rembrandt", title: "A Man seated reading at a Table in a Lofty Room", year: "c.1628-30" },
    { src: "images/gallery/theirs/22.jpg", artist: "Gino De' Bini", title: "Lucifero", year: "1887" },
    { src: "images/gallery/theirs/23.jpg", artist: "Bruce Davidson Wales", title: "Welsh Miners Series", year: "1965" }
    // Add more entries here, e.g.:
    // { src: "images/your-image.jpg", artist: "Artist Name", title: "Work Title", year: "2020" }
  ];

  // Shuffled "deck": every image is shown once before any repeats, and the same image is
  // never shown twice in a row (even across a reshuffle).
  var deck = [], pick = null;
  function nextPick(){
    if(!deck.length){
      deck = images.slice();
      for(var i = deck.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1)), t = deck[i]; deck[i] = deck[j]; deck[j] = t;
      }
      if(deck.length > 1 && deck[deck.length - 1] === pick){ deck.unshift(deck.pop()); }
    }
    return deck.pop();
  }
  pick = nextPick();

  var wrap = document.getElementById("frontispiece-wrap");
  var img = document.getElementById("frontispiece-img");
  var hoverCaption = document.getElementById("frontispiece-caption");
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightbox-img");
  var lightboxCaption = document.getElementById("lightbox-caption");
  var closeBtn = document.getElementById("lightbox-close");

  // "Artist, <em>Title</em> (Year)" - built from text nodes so quotes/symbols in titles are safe
  function fillCaption(el){
    el.textContent = "";
    el.appendChild(document.createTextNode(pick.artist + ", "));
    var em = document.createElement("em");
    em.textContent = pick.title;
    el.appendChild(em);
    el.appendChild(document.createTextNode(" (" + pick.year + ")"));
  }

  var refreshBtn = document.getElementById("gallery-refresh");

  function show(){
    img.alt = pick.artist + ", " + pick.title;
    img.src = pick.src;
    fillCaption(hoverCaption);
  }
  show();

  // Swap in the next image only once it has loaded, so the frame never flashes empty.
  refreshBtn.addEventListener("click", function(){
    var next = nextPick(), loader = new Image();
    loader.onload = loader.onerror = function(){ pick = next; show(); };
    loader.src = next.src;
  });

  function openLightbox(){
    lightboxImg.src = pick.src;
    lightboxImg.alt = img.alt;
    fillCaption(lightboxCaption);
    lightbox.classList.add("active");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    closeBtn.focus();
  }
  function closeLightbox(){
    if(!lightbox.classList.contains("active")) return;
    lightbox.classList.remove("active");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    wrap.focus();
  }

  wrap.addEventListener("click", openLightbox);
  closeBtn.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", function(e){
    if(e.target === lightbox){ closeLightbox(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ closeLightbox(); }
  });
})();
</script>
<script>
/* Header marker: clicking it plays its audio cue (restarts if already playing). */
(function(){
  var btn = document.querySelector('.page-mark-btn');
  if (!btn) return;
  var sound = new Audio(btn.getAttribute('data-sound'));
  sound.preload = 'auto';
  btn.addEventListener('click', function(){
    try {
      sound.currentTime = 0;
      var p = sound.play();
      if (p && p.catch) p.catch(function(){});
    } catch(err){}
  });
})();
</script>
</body>
</html>
