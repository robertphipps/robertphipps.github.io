<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script>
/* Substack link: on click, the Substack image slides across the header to the page-marker image,
   leave.wav plays as it starts moving, and the Substack page opens once it arrives.
   Without JS (or with reduced motion / modified clicks) the link behaves as a normal link. */
(function(){
  var link = document.querySelector('.header-link');
  var mark = document.querySelector('.page-mark');
  if (!link || !mark) return;
  var img = link.querySelector('img');

  var MOVE_MS = 1900;   // how long the slide takes
  var HOLD_MS = 250;    // pause after arriving, before the page opens
  var RETURN_MS = 500;  // slide back to the corner afterwards

  var sound = new Audio('audio/leave.wav');
  sound.preload = 'auto';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var busy = false, anim = null;

  function reset(){
    if (anim){ anim.cancel(); anim = null; }
    link.classList.remove('is-moving');
    busy = false;
  }

  function openSubstack(){
    var w = window.open(link.href, '_blank');
    if (w){ try { w.opener = null; } catch(e){} }
    else { window.location.href = link.href; }   // pop-up blocked: open in this tab instead
  }

  link.addEventListener('click', function(e){
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (reduceMotion.matches || !img.animate) return;   // fall back to the plain link
    e.preventDefault();
    if (busy) return;
    busy = true;

    var from = img.getBoundingClientRect();
    var to = mark.getBoundingClientRect();
    var dx = to.left - from.left, dy = to.top - from.top;

    link.classList.add('is-moving');
    try {
      sound.currentTime = 0;
      var p = sound.play();
      if (p && p.catch) p.catch(function(){});
    } catch(err){}

    anim = img.animate(
      [{ transform: 'translate(0,0)' }, { transform: 'translate(' + dx + 'px,' + dy + 'px)' }],
      { duration: MOVE_MS, easing: 'ease-in-out', fill: 'forwards' }
    );
    anim.finished.then(function(){
      return new Promise(function(r){ setTimeout(r, HOLD_MS); });
    }).then(function(){
      openSubstack();
      return new Promise(function(r){ setTimeout(r, 400); });
    }).then(function(){
      if (!anim) return;
      anim.updatePlaybackRate(-1);   // glide back to its corner
      return anim.finished.catch(function(){});
    }).then(reset, reset);
  });

  // Returning via the back button (page restored from cache) - put everything back.
  window.addEventListener('pageshow', function(e){ if (e.persisted) reset(); });
})();
</script>
<script>
/* Header marker: clicking it plays its audio cue (restarts if already playing). */
(function(){
  var btn = document.querySelector('.page-mark-btn');
  if (!btn) return;
  var sound = new Audio(btn.getAttribute('data-sound'));
  sound.preload = 'auto';
  btn.addEventListener('click', function(){
    try {
      sound.currentTime = 0;
      var p = sound.play();
      if (p && p.catch) p.catch(function(){});
    } catch(err){}
  });
})();
</script>
</body>
