     spot marked with a comment saying "CHANGE". -->

<!-- CHANGE: piece title -->
<title>Title of piece — Robert Phipps</title>
<link rel="icon" type="image/jpg" href="/images/favicon.jpg">
<link rel="preload" href="../fonts/texgyreheros-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles.css">
</head>
<body id="top"><!-- keep id="top": the arrow at the bottom jumps to it -->

<header class="site-logo has-mark">
  <a class="logo" href="../index.html" aria-label="Robert Phipps, home"><img class="logo-anim" src="../images/favicon.gif" alt="" width="48" height="48"><img class="logo-static" src="../images/favicon.jpg" alt="" width="48" height="48"></a>
  <!-- CHANGE: piece number in the file name, and the title in alt (small square icon: images/essays/piece-N.jpg) -->
  <img class="page-mark" src="../images/essays/piece-N.jpg" alt="Title of piece" width="48" height="48">
</header>

<main>
  <div class="wrap piece">
    <a class="breadcrumb" href="../essays-fiction.html">← Essays &amp; Fiction</a>
    <!-- CHANGE: title and date -->
    <h1 class="piece-title">Title of piece</h1>
    <p class="piece-meta">Month Year</p>

    <!-- CHANGE: header image (images/essays/piece-N-header.jpg) and its description in alt.
         No header image for this piece? Delete this whole <img> line. -->
    <img class="piece-header" src="../images/essays/piece-N-header.jpg" alt="Description of the image" width="1092" height="716">

    <!-- CHANGE: the piece. One <p> per paragraph. Wrap italic passages in <em>...</em>.
         <hr> makes a section break. -->
    <p><em>Italic opening note, if the piece has one.</em></p>
    <hr>
    <p>First paragraph of the piece.</p>
    <p>Second paragraph of the piece.</p>

    <a class="back-to-top" href="#top" aria-label="Back to top"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17V3M4 9l6-6 6 6"/></svg></a>
  </div>
</main>

<footer>
  <div class="colophon">© <span id="year"></span> Robert Phipps</div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
