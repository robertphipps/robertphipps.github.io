<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Robert Phipps</title>
<link rel="icon" type="image/jpg" href="/images/favicon.jpg">
<link rel="preload" href="fonts/texgyreheros-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body class="center-page gallery-page">

<header class="site-logo">
  <a class="logo" href="index.html" aria-label="Robert Phipps, home"><img class="logo-anim" src="images/favicon.gif" alt="" width="48" height="48"><img class="logo-static" src="images/favicon.jpg" alt="" width="48" height="48"></a>
</header>

<main>
  <button type="button" class="frontispiece-wrap" id="frontispiece-wrap" aria-label="Enlarge image">
    <img class="frontispiece" id="frontispiece-img" alt="">
    <span class="frontispiece-caption" id="frontispiece-caption"></span>
  </button>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image" aria-hidden="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <p class="lightbox-caption" id="lightbox-caption"></p>
</div>

<script>
(function(){
  var images = [
    { src: "images/brand-mark.jpg", artist: "Renato Mambor", title: "Capovolto", year: "1963" },
    { src: "images/mark2.jpg", artist: "Carl Strathmann", title: "Lunar Landscape with Owls", year: "1900" },
    { src: "images/mark3.jpg", artist: "J. M. W. Turner", title: "A Paddle-steamer in a Storm", year: "1841" },
    { src: "images/mark4.jpg", artist: "Jimmy Mitchell", title: "Paul Newman on the set of \"Butch Cassidy and the Sundance Kid\" Dir. George Roy Hill", year: "1969" },
    { src: "images/mark5.jpg", artist: "Paul Gervais", title: "Histoire naturelle des mammifères", year: "c.1854–1855" },
    { src: "images/mark6.jpg", artist: "Mark Rothko", title: "Untitled", year: "1961, Pen and ink and wash on woven paper" },
    { src: "images/mark7.jpg", artist: "Jean-Michel Basquiat", title: "Untitled (Peso Neto)", year: "1981, Crayon on notebook paper" },
    { src: "images/mark8.jpg", artist: "Francis Bacon", title: "Figure in a framework", year: "c.1957-61, Graphite and oil paint on paper" },
    { src: "images/mark9.jpg", artist: "Fernand Nadal", title: "Untitled (Through the Porthole, Ocean and Sky)", year: "Late 19th Century" },
    { src: "images/mark10.jpg", artist: "Shiko Munakata", title: "Bush Warbler", year: "1959, Woodcut" },
    { src: "images/mark11.jpg", artist: "Robert Rauschenberg", title: "Untitled (Pegasus)", year: "1991, Woodcut" },
    { src: "images/mark12.jpg", artist: "George Ault", title: "Moon and Clouds", year: "1945" },
    { src: "images/mark13.jpg", artist: "June Wayne", title: "Tenth Memory", year: "1961" },
    { src: "images/mark14.jpg", artist: "Jiri Jenicek", title: "Stairs", year: "1931" },
    { src: "images/mark15.jpg", artist: "Elliott Erwitt", title: "From \"New York City\"", year: "1949" },
    { src: "images/mark16.jpg", artist: "Marc Riboud", title: "Elephants bathing in the Gange", year: "1956" },
    { src: "images/mark17.jpg", artist: "Roy DeCarava", title: "Dancers", year: "1956" },
    { src: "images/mark18.jpg", artist: "Ernst Haas", title: "On the Set of \"Love and Death\" Dir. Woody Allen", year: "1975" },
    { src: "images/mark19.jpg", artist: "Anton Pieck", title: "Moonlight Night", year: "1941" },
    { src: "images/mark20.jpg", artist: "Henri Cartier-Bresson", title: "Italy, Sicily, Palermo, Town Hall", year: "1971" },
    { src: "images/mark21.jpg", artist: "Fan Ho", title: "Trio 三重奏", year: "1956" },
    { src: "images/mark22.jpg", artist: "Follower of Rembrandt", title: "A Man seated reading at a Table in a Lofty Room", year: "c.1628-30" }
    // Add more entries here, e.g.:
    // { src: "images/your-image.jpg", artist: "Artist Name", title: "Work Title", year: "2020" }
  ];

  var pick = images[Math.floor(Math.random() * images.length)];

  var wrap = document.getElementById("frontispiece-wrap");
  var img = document.getElementById("frontispiece-img");
  var hoverCaption = document.getElementById("frontispiece-caption");
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightbox-img");
  var lightboxCaption = document.getElementById("lightbox-caption");
  var closeBtn = document.getElementById("lightbox-close");

  // "Artist, <em>Title</em> (Year)" - built from text nodes so quotes/symbols in titles are safe
  function fillCaption(el){
    el.textContent = "";
    el.appendChild(document.createTextNode(pick.artist + ", "));
    var em = document.createElement("em");
    em.textContent = pick.title;
    el.appendChild(em);
    el.appendChild(document.createTextNode(" (" + pick.year + ")"));
  }

  img.alt = pick.artist + ", " + pick.title;
  img.src = pick.src;
  fillCaption(hoverCaption);

  function openLightbox(){
    lightboxImg.src = pick.src;
    lightboxImg.alt = img.alt;
    fillCaption(lightboxCaption);
    lightbox.classList.add("active");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    closeBtn.focus();
  }
  function closeLightbox(){
    if(!lightbox.classList.contains("active")) return;
    lightbox.classList.remove("active");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    wrap.focus();
  }

  wrap.addEventListener("click", openLightbox);
  closeBtn.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", function(e){
    if(e.target === lightbox){ closeLightbox(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ closeLightbox(); }
  });
})();
</script>
</body>
</html>
